{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-card card">
        <div class="card-body">
            <h2 class="text-center mb-4" id="login-title">Login</h2>
            
            <form id="login-form">
                <div class="mb-3">
                    <label for="username" class="form-label" id="username-label">Username</label>
                    <input type="text" class="form-control" id="username" required>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label" id="password-label">Password</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                
                <button type="submit" class="btn btn-primary w-100" id="login-btn">Login</button>
            </form>
            
            <div class="text-center mt-3" id="register-link-container">
                <small id="no-account-text">Don't have an account?</small>
                <a href="/register" id="register-link" class="btn btn-sm btn-outline-primary ms-2" role="button" aria-label="Register">Register</a>
            </div>
            
            <!-- Language Selector -->
            <div class="text-center mt-3">
                <div class="btn-group" role="group">
                    <button type="button" class="btn btn-sm btn-outline-secondary" onclick="setLanguage('en')">EN</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" onclick="setLanguage('sl')">SL</button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    // Translate page
    document.getElementById('login-title').textContent = t('login');
    document.getElementById('username-label').textContent = t('username');
    document.getElementById('password-label').textContent = t('password');
    document.getElementById('login-btn').textContent = t('login');
    document.getElementById('no-account-text').textContent = t('no_account') + ' ';
    document.getElementById('register-link').textContent = t('register');
    
    // Check if registration is enabled
    fetch('/api/config')
        .then(res => res.json())
        .then(config => {
            if (!config.registration_enabled) {
                document.getElementById('register-link-container').style.display = 'none';
            }
        });
    
    // Handle login
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        
        try {
            const result = await API.post('/api/auth/login', { username, password });
            window.location.href = '/';
        } catch (error) {
            showToast(error.message, 'error');
        }
    });
</script>
{% endblock %}
