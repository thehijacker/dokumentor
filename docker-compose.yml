services:
  dokumentor:
    image: dokumentor:latest
    build: .
    container_name: dokumentor
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data:/app/data
      - ./documents:/app/documents
      - ./watch_folder:/app/watch_folder
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml:ro
    environment:
      # Application
      - APP_SECRET_KEY=${APP_SECRET_KEY:-change-this-secret-key-in-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_SECURE_COOKIES=${APP_SECURE_COOKIES:-false}
      
      # Database
      - DATABASE_PATH=${DATABASE_PATH:-./data/documents.db}
      
      # Storage
      - DOCUMENTS_PATH=${DOCUMENTS_PATH:-./documents}
      - WATCH_FOLDER=${WATCH_FOLDER:-./watch_folder}
      
      # Authentication
      - ENABLE_REGISTRATION=${ENABLE_REGISTRATION:-false}
      
      # OCR
      - OCR_DEFAULT_LANGUAGES=${OCR_DEFAULT_LANGUAGES:-slv,eng}
      - TESSERACT_PATH=${TESSERACT_PATH:-}
      
      # PDF (Optional: Global passwords as fallback - users can set their own in Settings)
      - PDF_DECRYPT_PASSWORDS=${PDF_DECRYPT_PASSWORDS:-}
      
      # AI
      - AI_PROVIDER=${AI_PROVIDER:-internal}
      - AI_MODEL=${AI_MODEL:-simple}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_URL=${OLLAMA_URL:-http://localhost:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama2}
      
      # Watch Folder
      - WATCH_FOLDER_ENABLED=${WATCH_FOLDER_ENABLED:-true}
