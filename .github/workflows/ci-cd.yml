name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-slv poppler-utils
    
    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 backend/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Detect tests
      id: detect_tests
      run: |
        echo "Detecting test files..."
        files=$(git ls-files -z | tr '\0' '\n' | grep -E '(^tests/.*\.py$|.*/test_.*\.py$|^test_.*\.py$)' | head -n1 || true)
        if [ -n "$files" ]; then
          echo "found=true" >> $GITHUB_OUTPUT
        else
          echo "found=false" >> $GITHUB_OUTPUT
        fi

    - name: Test with pytest
      if: steps.detect_tests.outputs.found == 'true'
      id: test
      run: |
        pytest --cov=backend --cov-report=xml --cov-report=html

    - name: Skip tests (no tests found)
      if: steps.detect_tests.outputs.found == 'false'
      run: |
        echo "No tests found, skipping pytest and coverage upload."

    - name: Upload coverage reports
      if: steps.detect_tests.outputs.found == 'true'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build image (no push)
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        load: true
        tags: |
          ghcr.io/${{ github.repository }}:ci-${{ github.sha }}
        platforms: linux/amd64
        file: ./Dockerfile

    - name: Save image to tarball
      run: |
        docker save ghcr.io/${{ github.repository }}:ci-${{ github.sha }} -o image-${{ github.sha }}.tar

    - name: Upload image artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image-ci
        path: image-${{ github.sha }}.tar

    - name: Cleanup image tar
      run: |
        rm -f image-${{ github.sha }}.tar
